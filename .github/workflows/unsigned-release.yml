name: Unsigned Release

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unsigned-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PROJECT: DynamicIsland.xcodeproj
  SCHEME: DynamicIsland
  APP_NAME: Atoll

jobs:
  build-and-release:
    name: Build and publish unsigned DMG
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Validate project configuration
        run: |
          python3 -m unittest tests.test_privacy_configuration
          python3 -m unittest tests.test_timer_lifecycle

      - name: Install Metal Toolchain
        run: |
          sudo xcodebuild -runFirstLaunch || true
          if ! xcrun --sdk macosx metal --version >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Build unsigned app
        run: |
          rm -rf build/DerivedData

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            build

          test -d "build/DerivedData/Build/Products/Release/${APP_NAME}.app"

          codesign --force --deep --sign - --timestamp=none \
            "build/DerivedData/Build/Products/Release/${APP_NAME}.app"
          codesign --verify --deep --strict --verbose=2 \
            "build/DerivedData/Build/Products/Release/${APP_NAME}.app"

      - name: Create unsigned DMG
        id: package
        run: |
          BASE_VERSION=$(tr -d '[:space:]' < VERSION)
          VERSION="${BASE_VERSION}-unsigned.${GITHUB_RUN_NUMBER}"
          DMG_NAME="${APP_NAME}-${VERSION}.dmg"

          rm -rf build/dmg "build/${DMG_NAME}"
          mkdir -p build/dmg
          cp -R \
            "build/DerivedData/Build/Products/Release/${APP_NAME}.app" \
            build/dmg/
          ln -s /Applications build/dmg/Applications
          cat > "build/dmg/Install Atoll.command" <<'INSTALLER'
          #!/bin/bash
          set -euo pipefail

          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          APP_SOURCE="$SCRIPT_DIR/Atoll.app"

          if [[ ! -d "$APP_SOURCE" ]]; then
            echo "Atoll.app was not found beside this installer."
            read -r -p "Press Return to close."
            exit 1
          fi

          echo "Installing Atoll into /Applications..."
          osascript -e 'tell application "Atoll" to quit' >/dev/null 2>&1 || true
          sudo rm -rf "/Applications/Atoll.app"
          sudo ditto "$APP_SOURCE" "/Applications/Atoll.app"
          sudo xattr -dr com.apple.quarantine "/Applications/Atoll.app" 2>/dev/null || true
          open -a Atoll

          DMG_PATH="$(python3 - "$SCRIPT_DIR" <<'PY'
          import plistlib
          import subprocess
          import sys

          mount_point = sys.argv[1]
          info = plistlib.loads(subprocess.check_output(["hdiutil", "info", "-plist"]))
          for image in info.get("images", []):
              entities = image.get("system-entities", [])
              if any(entity.get("mount-point") == mount_point for entity in entities):
                  print(image.get("image-path", ""))
                  break
          PY
          )"
          if [[ -n "$DMG_PATH" && -f "$DMG_PATH" ]]; then
            hdiutil detach "$SCRIPT_DIR" -quiet || true
            rm -f "$DMG_PATH" 2>/dev/null || true
          fi
          echo "Atoll was installed. You can close this window."
          read -r
          INSTALLER
          chmod +x "build/dmg/Install Atoll.command"

          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder build/dmg \
            -ov \
            -format UDZO \
            "build/${DMG_NAME}"

          hdiutil verify "build/${DMG_NAME}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atoll-unsigned-${{ steps.package.outputs.version }}
          path: build/${{ steps.package.outputs.dmg_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.package.outputs.version }}"
          DMG_NAME="${{ steps.package.outputs.dmg_name }}"

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${APP_NAME} ${{ steps.package.outputs.version }}" \
            --notes "Unsigned build from commit ${GITHUB_SHA}. macOS may require manually approving the app on first launch." \
            --prerelease \
            "build/${DMG_NAME}"
